services:
  # Gemelo digital: MuJoCo + unitree_sdk2_python, expuesto por noVNC en el navegador.
  # Requiere que el repo unitree_mujoco esté clonado como carpeta hermana de este
  # proyecto (../../unitree_mujoco desde acá), tal como lo referencia backend/README.md.
  simulator:
    build:
      context: ./docker/simulator
    volumes:
      - ../../unitree_mujoco:/workspace/unitree_mujoco
    ports:
      - "6080:6080" # noVNC -> http://localhost:6080/vnc.html
      - "8000:8000" # backend (comparte red con este servicio, ver abajo)
    environment:
      - DISPLAY=:1
      # Modelo del G1 que simula el gemelo (ver docker/simulator/Dockerfile). Vacío = el de
      # unitree_mujoco/simulate_python/config.py (g1_29dof, no camina con la política pública).
      - SIM_SCENE=/opt/unitree_rl_gym/resources/robots/g1_description/scene.xml

  # Backend FastAPI. Comparte el network namespace del simulador para poder
  # hablar DDS por "lo" (loopback) tal como espera unitree_sdk2_python/mujoco.
  backend:
    build:
      context: ./backend
    network_mode: "service:simulator"
    environment:
      - G1_ADAPTER=mujoco          # mock = sin DDS (robot simulado en memoria)
      - G1_ROBOT_ID=g1-01          # robot de la app que es el gemelo digital
      - DDS_DOMAIN_ID=1            # unitree_mujoco/simulate_python/config.py
      - DDS_INTERFACE=lo
      - SIM_CONTROL_URL=http://127.0.0.1:8765  # reset/arnés de docker/simulator/sim_launcher.py
    depends_on:
      - simulator
